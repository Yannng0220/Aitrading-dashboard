<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Battle Role Classifier</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Pokemon Role AI</p>
        <h1>攻擊、防禦或輔助</h1>
        <p class="subtitle">
          模型會直接在瀏覽器中執行，不需要 Python 後端。這個版本適合部署到 Cloudflare Pages、
          GitHub Pages 或一般靜態網站空間。
        </p>
      </section>

      <section class="panel">
        <div class="upload-card">
          <label class="upload-box" for="imageInput">
            <input id="imageInput" type="file" accept="image/*" />
            <span>點這裡選擇圖片</span>
            <small>支援 JPG / PNG / WebP</small>
          </label>
          <div class="actions">
            <button id="predictButton" type="button" disabled>開始分析</button>
          </div>
        </div>

        <div class="preview-card">
          <div class="preview-frame">
            <img id="previewImage" alt="圖片預覽" hidden />
            <p id="previewPlaceholder">圖片預覽會顯示在這裡</p>
          </div>
        </div>
      </section>

      <section class="panel result-panel">
        <div class="result-head">
          <h2>分析結果</h2>
          <p id="statusText">模型初始化中...</p>
        </div>

        <div class="result-main">
          <div class="winner-card">
            <p class="winner-label">最可能定位</p>
            <h3 id="winnerRole">尚未分析</h3>
            <p id="winnerConfidence">信心值: -</p>
          </div>

          <div class="score-list" id="scoreList">
            <div class="score-item">
              <div class="score-meta">
                <span>attack</span>
                <span>-</span>
              </div>
              <div class="score-bar"><div style="width: 0%"></div></div>
            </div>
            <div class="score-item">
              <div class="score-meta">
                <span>defense</span>
                <span>-</span>
              </div>
              <div class="score-bar"><div style="width: 0%"></div></div>
            </div>
            <div class="score-item">
              <div class="score-meta">
                <span>support</span>
                <span>-</span>
              </div>
              <div class="score-bar"><div style="width: 0%"></div></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script type="module" src="./web-app.js?v=20260513-2"></script>
  </body>
</html>
